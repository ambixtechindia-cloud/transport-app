- name: Install system dependencies
  run: |
    sudo apt update
    sudo apt install -y \
      zip unzip openjdk-17-jdk \
      python3-pip git

- name: Install Buildozer
  run: |
    pip install --upgrade pip
    pip install buildozer cython

- name: Pre-install Android SDK components for Buildozer
  run: |
    mkdir -p ~/.buildozer/android/platform
    yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk \
      "platform-tools" \
      "platforms;android-33" \
      "build-tools;33.0.2"

- name: Accept Android SDK licenses (Buildozer SDK)
  run: |
    yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

- name: Build APK
  run: |
    buildozer android debug

